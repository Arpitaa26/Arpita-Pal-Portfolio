    <text x="454" y="650" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">15:00</text>
    <text x="576" y="650" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">18:00</text>
