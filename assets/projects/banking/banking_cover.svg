    <text x="824" y="494" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">SEPA-EU88201</text>
    <text x="1052" y="476" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">-€890K</text>
    <text x="1060" y="494" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Pending</text>

    <!-- Table Row 3 -->
    <rect x="780" y="515" width="340" height="52" rx="10" fill="rgba(255,255,255,0.03)"/>
    <circle cx="804" cy="541" r="10" fill="#10B981" opacity="0.2"/>
    <text x="800" y="545" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">£</text>
    <text x="824" y="536" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">London Treasury</text>
    <text x="824" y="554" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CHAPS-UK1029</text>
    <text x="1050" y="536" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">+£1.20M</text>
    <text x="1065" y="554" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Settled</text>

    <!-- Table Row 4 -->
    <rect x="780" y="575" width="340" height="52" rx="10" fill="rgba(255,255,255,0.03)"/>
    <circle cx="804" cy="601" r="10" fill="#8B5CF6" opacity="0.2"/>
    <text x="800" y="605" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="bold">¥</text>
    <text x="824" y="596" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Tokyo FX Desk</text>
    <text x="824" y="614" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">BOJ-JP99014</text>
    <text x="1040" y="596" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">+¥420M</text>
    <text x="1065" y="614" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Settled</text>

    <!-- View All CTA -->
    <rect x="780" y="638" width="340" height="38" rx="8" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.2)"/>
    <text x="910" y="662" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Inspect Full Audit Ledger →</text>
