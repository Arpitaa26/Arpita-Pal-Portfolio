  <!-- Top Navigation Bar Mockup -->
  <rect x="60" y="50" width="1080" height="64" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <!-- Logo Pill -->
  <rect x="84" y="66" width="32" height="32" rx="8" fill="url(#blueGlow)"/>
  <path d="M 94 77 L 100 83 L 106 77 M 94 85 L 106 85" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="128" y="87" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">BANKING HUB</text>
  
  <!-- Navigation items -->
  <rect x="290" y="68" width="110" height="28" rx="14" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)"/>
  <text x="312" y="87" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Treasury</text>
  <text x="430" y="87" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Liquidity Pools</text>
  <text x="560" y="87" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">FX Operations</text>
  <text x="690" y="87" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Audit Trails</text>

  <!-- Right Actions -->
