  <text x="1016" y="87" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">+ New Transfer</text>

  <!-- Metric Cards Row -->
  <!-- Card 1 -->
  <g filter="url(#shadow1)">
    <rect x="60" y="140" width="340" height="150" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="84" y="174" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Total Consolidated Liquidity</text>
    <text x="84" y="215" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">$148,920,400.00</text>
    <rect x="84" y="235" width="85" height="22" rx="11" fill="rgba(16,185,129,0.15)"/>
    <text x="96" y="250" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">▲ Positive Flow</text>
    <text x="180" y="250" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Active accounts</text>
    <!-- Mini sparkline -->
