<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="200" fill="url(#avatarBg)"/>
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="190" stroke="url(#accentGlow)" stroke-width="4" opacity="0.8"/>
  <circle cx="200" cy="200" r="170" fill="#0B0F17"/>

  <!-- Designer Stylized Monogram Graphic -->
  <g transform="translate(110, 110)">
    <!-- Letter A Stylized with Design & Code Nodes -->
    <path d="M 90 20 L 30 150 L 60 150 L 75 110 L 105 110 L 120 150 L 150 150 Z" fill="url(#accentGlow)"/>
    <polygon points="90,55 80,92 100,92" fill="#0B0F17"/>
    
    <!-- Code Bracket and Pen Tool Accents -->
    <circle cx="90" cy="20" r="6" fill="#06B6D4"/>
    <circle cx="30" cy="150" r="6" fill="#F43F5E"/>
    <circle cx="150" cy="150" r="6" fill="#8B5CF6"/>
    
    <path d="M 15 70 L 0 90 L 15 110" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 70 L 180 90 L 165 110" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
