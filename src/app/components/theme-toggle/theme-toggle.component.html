<aside class="floating-theme-dock" aria-label="Theme switcher">
  <button 
    type="button" 
    class="theme-toggle-btn" 
    (click)="toggleTheme()"
    [attr.aria-label]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
    [attr.title]="themeService.isDark() ? 'Switch to Light mode' : 'Switch to Dark mode'"
  >
    <!-- Dark Mode: Moon Icon -->
    @if (themeService.isDark()) {
      <div class="icon-wrap moon-mode" key="moon">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          <path d="M19 3v4"></path>
          <path d="M21 5h-4"></path>
        </svg>
      </div>
    } @else {
      <!-- Light Mode: Sun Icon -->
      <div class="icon-wrap sun-mode" key="sun">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </div>
    }

    <div class="theme-pill-label">
      <span class="mode-text">{{ themeService.isDark() ? 'Dark' : 'Light' }}</span>
    </div>

    <!-- Tooltip Floating Badge -->
    <span class="dock-tooltip">
      {{ themeService.isDark() ? 'Switch to Light theme' : 'Switch to Dark theme' }}
    </span>
  </button>
</aside>
