name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --base-href /Arpita-Pal-Portfolio/

      - name: Setup Single Page App Routing & Bypass Jekyll
        run: |
          cp dist/portfolio-app/browser/index.html dist/portfolio-app/browser/404.html
          mkdir -p dist/portfolio-app/browser/all-projects
          cp dist/portfolio-app/browser/index.html dist/portfolio-app/browser/all-projects/index.html
          touch dist/portfolio-app/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/portfolio-app/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
