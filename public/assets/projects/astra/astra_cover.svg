<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" rx="24" fill="#0E121B"/>

  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="cardAstra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202F"/>
      <stop offset="100%" stop-color="#101724"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="300" fill="#EC4899" opacity="0.12" filter="blur(90px)"/>
  <circle cx="1000" cy="500" r="300" fill="#8B5CF6" opacity="0.1" filter="blur(90px)"/>

  <!-- Top Header -->
  <rect x="60" y="45" width="1080" height="60" rx="14" fill="url(#cardAstra)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="80" y="59" width="32" height="32" rx="8" fill="url(#pinkGrad)"/>
  <circle cx="96" cy="75" r="7" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="124" y="80" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">ASTRA DESIGN SYSTEM</text>
  
  <rect x="340" y="61" width="130" height="28" rx="14" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.3)"/>
  <text x="358" y="80" fill="#F472B6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">v3.4 Production</text>
  <text x="500" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Foundations</text>
  <text x="610" y="80" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Components (45)</text>
  <text x="750" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Tokens (180)</text>

  <!-- Left Column: Token Foundation -->
  <rect x="60" y="125" width="480" height="570" rx="18" fill="url(#cardAstra)" stroke="rgba(255,255,255,0.08)"/>
  <text x="88" y="162" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Design Tokens & Color Engine</text>
  <text x="88" y="182" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Bi-directional sync between Figma Variables & SCSS</text>

  <!-- Color Palette Swatches -->
  <g transform="translate(88, 205)">
    <!-- Swatch 1 -->
    <rect x="0" y="0" width="80" height="54" rx="8" fill="#EC4899"/>
    <text x="6" y="70" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">primary-500</text>
    <text x="6" y="84" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#EC4899</text>

    <!-- Swatch 2 -->
    <rect x="100" y="0" width="80" height="54" rx="8" fill="#F43F5E"/>
    <text x="106" y="70" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">rose-500</text>
    <text x="106" y="84" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#F43F5E</text>

    <!-- Swatch 3 -->
    <rect x="200" y="0" width="80" height="54" rx="8" fill="#3B82F6"/>
    <text x="206" y="70" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">blue-500</text>
    <text x="206" y="84" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#3B82F6</text>

    <!-- Swatch 4 -->
    <rect x="300" y="0" width="80" height="54" rx="8" fill="#10B981"/>
    <text x="306" y="70" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">emerald-500</text>
    <text x="306" y="84" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#10B981</text>
  </g>

  <!-- Typography Scale Spec -->
  <g transform="translate(88, 320)">
    <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Typography Scale Hierarchy</text>
    <text x="0" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Heading Display (24px / 800)</text>
    <text x="0" y="60" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600">Heading Medium (18px / 600)</text>
    <text x="0" y="86" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400">Body Regular - 14px / 1.6 line height for legibility</text>
    <text x="0" y="112" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">Code / Mono Token - 12px for system telemetry</text>
  </g>

  <!-- Figma Code Connect Token Box -->
  <rect x="88" y="475" width="424" height="195" rx="12" fill="#080C13" stroke="rgba(255,255,255,0.06)"/>
  <text x="108" y="505" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="11">// tokens.config.ts (Generated)</text>
  <text x="108" y="530" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">export const astraTokens = {</text>
  <text x="124" y="555" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">  color: { brand: 'var(--astra-primary)' },</text>
  <text x="124" y="580" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">  radius: { pill: '9999px', md: '12px' },</text>
  <text x="124" y="605" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">  elevation: { glow: '0 0 24px rgba(236,72,153,0.3)' }</text>
  <text x="108" y="630" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">};</text>

  <!-- Right Column: Interactive Component Matrix -->
  <rect x="565" y="125" width="575" height="570" rx="18" fill="url(#cardAstra)" stroke="rgba(255,255,255,0.08)"/>
  <text x="595" y="162" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Atomic Component Matrix & States</text>
  <text x="595" y="182" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Interactive state variants rendered with 100% WCAG AA contrast</text>

  <!-- Button States -->
  <g transform="translate(595, 215)">
    <!-- Primary Default -->
    <rect x="0" y="0" width="125" height="42" rx="21" fill="url(#pinkGrad)"/>
    <text x="28" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Primary</text>

    <!-- Hover State with Glow -->
    <rect x="140" y="0" width="125" height="42" rx="21" fill="url(#pinkGrad)" filter="drop-shadow(0 0 10px rgba(236,72,153,0.6))"/>
    <text x="166" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Hover ✨</text>

    <!-- Secondary Outline -->
    <rect x="280" y="0" width="125" height="42" rx="21" fill="transparent" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="312" y="26" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Outline</text>

    <!-- Disabled State -->
    <rect x="420" y="0" width="105" height="42" rx="21" fill="rgba(255,255,255,0.05)"/>
    <text x="444" y="26" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Disabled</text>
  </g>

  <!-- Input Form Controls -->
  <g transform="translate(595, 285)">
    <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Input Fields & Validations</text>
    
    <!-- Input 1 Normal -->
    <rect x="0" y="15" width="250" height="46" rx="10" fill="#0B0F17" stroke="rgba(255,255,255,0.12)"/>
    <text x="16" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">user@enterprise.com</text>

    <!-- Input 2 Focused / Valid -->
    <rect x="270" y="15" width="250" height="46" rx="10" fill="#0B0F17" stroke="#10B981" stroke-width="1.5"/>
    <text x="286" y="44" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">design-token-valid</text>
    <circle cx="495" cy="38" r="8" fill="#10B981"/>
    <path d="M 491 38 L 494 41 L 499 35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Badges & Segmented Controls -->
  <g transform="translate(595, 385)">
    <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Segmented Switches & Status Pills</text>
    
    <!-- Segmented control -->
    <rect x="0" y="15" width="280" height="40" rx="20" fill="#090D14" stroke="rgba(255,255,255,0.08)"/>
    <rect x="4" y="19" width="90" height="32" rx="16" fill="url(#pinkGrad)"/>
    <text x="28" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Design</text>
    <text x="122" y="40" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Specs</text>
    <text x="208" y="40" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Code</text>

    <!-- Badges -->
    <rect x="300" y="18" width="90" height="32" rx="16" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="318" y="39" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">✓ Verified</text>

    <rect x="405" y="18" width="115" height="32" rx="16" fill="rgba(244,63,94,0.15)" stroke="rgba(244,63,94,0.3)"/>
    <text x="420" y="39" fill="#FB7185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">● 0 Lints Found</text>
  </g>

  <!-- Modal Dialog Preview -->
  <g transform="translate(595, 470)">
    <rect x="0" y="0" width="525" height="195" rx="14" fill="#0A0E17" stroke="rgba(255,255,255,0.1)"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(236,72,153,0.15)"/>
    <circle cx="40" cy="40" r="10" stroke="#EC4899" stroke-width="2"/>
    <text x="75" y="36" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Deploy Design Token Update?</text>
    <text x="75" y="56" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Syncing 18 tokens across 4 downstream applications.</text>
    
    <rect x="20" y="80" width="485" height="42" rx="8" fill="rgba(255,255,255,0.03)"/>
    <text x="36" y="106" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">✓ WCAG Contrast Verified • Zero Breaking Changes</text>

    <!-- Action buttons -->
    <rect x="260" y="138" width="110" height="36" rx="8" fill="rgba(255,255,255,0.08)"/>
    <text x="294" y="161" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">Cancel</text>
    <rect x="385" y="138" width="120" height="36" rx="8" fill="url(#pinkGrad)"/>
    <text x="410" y="161" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Confirm Sync</text>
  </g>
</svg>
