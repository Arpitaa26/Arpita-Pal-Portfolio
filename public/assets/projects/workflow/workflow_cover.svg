<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" rx="24" fill="#0B0F19"/>

  <defs>
    <!-- Dot Matrix Pattern -->
    <pattern id="dot-canvas" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="rgba(255, 255, 255, 0.1)"/>
    </pattern>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C2A"/>
      <stop offset="100%" stop-color="#0F1420"/>
    </linearGradient>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="24" fill="url(#dot-canvas)"/>
  <circle cx="300" cy="300" r="300" fill="#F59E0B" opacity="0.08" filter="blur(90px)"/>
  <circle cx="850" cy="450" r="300" fill="#06B6D4" opacity="0.08" filter="blur(90px)"/>

  <!-- Top Canvas Header -->
  <rect x="60" y="45" width="1080" height="60" rx="14" fill="#131926" stroke="rgba(255,255,255,0.08)"/>
  <rect x="80" y="59" width="32" height="32" rx="8" fill="url(#amberGrad)"/>
  <path d="M 90 75 L 96 68 L 102 75 L 96 82 Z" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="124" y="80" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">VISUAL WORKFLOW BUILDER</text>
  
  <rect x="370" y="61" width="140" height="28" rx="14" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
  <text x="388" y="80" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">⚡ Live Canvas (60 FPS)</text>

  <rect x="980" y="59" width="140" height="32" rx="8" fill="url(#amberGrad)"/>
  <text x="1006" y="80" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">▶ Run Pipeline</text>

  <!-- Bezier Connecting Wires -->
  <!-- Wire 1: Trigger -> Transformer -->
  <path d="M 330 260 C 430 260, 430 380, 520 380" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="425" cy="320" r="4" fill="#F59E0B"/>

  <!-- Wire 2: Transformer -> AI Model -->
  <path d="M 760 380 C 840 380, 840 240, 910 240" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="835" cy="310" r="4" fill="#06B6D4"/>

  <!-- Wire 3: Transformer -> DB Store -->
  <path d="M 760 410 C 840 410, 840 540, 910 540" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="835" cy="475" r="4" fill="#8B5CF6"/>

  <!-- NODE 1: Ingestion Trigger -->
  <g filter="url(#nodeShadow)">
    <rect x="90" y="190" width="240" height="150" rx="16" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="106" y="206" width="32" height="32" rx="8" fill="rgba(245,158,11,0.2)"/>
    <circle cx="122" cy="222" r="6" fill="#F59E0B"/>
    <text x="148" y="222" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Webhook Trigger</text>
    <text x="148" y="238" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">POST /v1/incoming-lead</text>

    <!-- Node body -->
    <rect x="106" y="252" width="208" height="34" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="118" y="274" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">● Active • 200 OK</text>
    <text x="106" y="315" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Payload: JSON Schema</text>

    <!-- Output Port -->
    <circle cx="330" cy="260" r="7" fill="#F59E0B" stroke="#0B0F19" stroke-width="2"/>
  </g>

  <!-- NODE 2: Data Transformer & Schema Filter -->
  <g filter="url(#nodeShadow)">
    <rect x="520" y="300" width="240" height="170" rx="16" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="536" y="316" width="32" height="32" rx="8" fill="rgba(6,182,212,0.2)"/>
    <path d="M 548 332 L 556 324 L 556 340 Z" fill="#06B6D4"/>
    <text x="578" y="332" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">JSON Transformer</text>
    <text x="578" y="348" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Filter & Normalize</text>

    <!-- Input Port -->
    <circle cx="520" cy="380" r="7" fill="#06B6D4" stroke="#0B0F19" stroke-width="2"/>

    <!-- Code Block Inside Node -->
    <rect x="536" y="362" width="208" height="50" rx="6" fill="#080C14"/>
    <text x="548" y="382" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10">return payload.map(u =></text>
    <text x="548" y="398" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="10">  ({ ...u, score: calc(u) }))</text>

    <text x="536" y="445" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">✓ Execution time: 4ms</text>

    <!-- Output Ports -->
    <circle cx="760" cy="380" r="7" fill="#06B6D4" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="760" cy="410" r="7" fill="#8B5CF6" stroke="#0B0F19" stroke-width="2"/>
  </g>

  <!-- NODE 3A: AI Analysis Model -->
  <g filter="url(#nodeShadow)">
    <rect x="910" y="160" width="230" height="150" rx="16" fill="url(#nodeGrad)" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="926" y="176" width="32" height="32" rx="8" fill="rgba(236,72,153,0.2)"/>
    <text x="968" y="192" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Claude / GPT-4o</text>
    <text x="968" y="208" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Sentiment & Intent</text>

    <circle cx="910" cy="240" r="7" fill="#EC4899" stroke="#0B0F19" stroke-width="2"/>

    <rect x="926" y="222" width="198" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="938" y="244" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="10">Prompt: "Extract legal intent"</text>
    <text x="938" y="258" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Tokens: 142 • Temp: 0.2</text>
    <text x="926" y="292" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">Confidence: 99.4%</text>
  </g>

  <!-- NODE 3B: PostgreSQL Sink -->
  <g filter="url(#nodeShadow)">
    <rect x="910" y="460" width="230" height="150" rx="16" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="926" y="476" width="32" height="32" rx="8" fill="rgba(139,92,246,0.2)"/>
    <text x="968" y="492" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">PostgreSQL Sink</text>
    <text x="968" y="508" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">INSERT into leads_prod</text>

    <circle cx="910" cy="540" r="7" fill="#8B5CF6" stroke="#0B0F19" stroke-width="2"/>

    <rect x="926" y="522" width="198" height="42" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="938" y="544" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="10">Row ID: #884920</text>
    <text x="938" y="558" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9">Latency: 1.8ms</text>
    <text x="926" y="592" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">Status: Committed</text>
  </g>

  <!-- Floating Minimap Preview -->
  <g filter="url(#nodeShadow)">
    <rect x="90" y="550" width="180" height="110" rx="12" fill="#0D131F" stroke="rgba(255,255,255,0.12)"/>
    <text x="105" y="572" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">CANVAS MINIMAP</text>
    <rect x="105" y="585" width="25" height="15" rx="3" fill="#F59E0B" opacity="0.6"/>
    <rect x="140" y="595" width="25" height="15" rx="3" fill="#06B6D4" opacity="0.6"/>
    <rect x="180" y="580" width="25" height="15" rx="3" fill="#EC4899" opacity="0.6"/>
    <rect x="180" y="615" width="25" height="15" rx="3" fill="#8B5CF6" opacity="0.6"/>
    <rect x="98" y="578" width="120" height="60" rx="4" fill="none" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
</svg>
